# DataBridge - production-like stack
# For hot reload during development use: docker compose -f docker-compose.dev.yml up

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-databridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-databridge}
      POSTGRES_DB: ${POSTGRES_DB:-databridge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-databridge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-databridge}:${POSTGRES_PASSWORD:-databridge}@db:5432/${POSTGRES_DB:-databridge}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-databridge}:${POSTGRES_PASSWORD:-databridge}@db:5432/${POSTGRES_DB:-databridge}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your environment}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in your environment}
      DEBUG: "false"
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-databridge}:${POSTGRES_PASSWORD:-databridge}@db:5432/${POSTGRES_DB:-databridge}
      DATABASE_SYNC_URL: postgresql+psycopg2://${POSTGRES_USER:-databridge}:${POSTGRES_PASSWORD:-databridge}@db:5432/${POSTGRES_DB:-databridge}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your environment}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in your environment}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
