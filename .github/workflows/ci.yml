name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_SECRET_KEY: ci-secret-key-that-is-long-enough-123456
  TEST_ENCRYPTION_KEY: eKNAOtb7BYu1WMlxkh5tdnFLeNbaF5qAVmJi5MvVg2o=

jobs:
  backend-quality:
    name: Backend lint & types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Check formatting (ruff format)
        run: ruff format --check app tests

      - name: Type check (mypy)
        run: mypy app

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          DEBUG: "true"
          SECRET_KEY: ${{ env.TEST_SECRET_KEY }}
          ENCRYPTION_KEY: ${{ env.TEST_ENCRYPTION_KEY }}
        run: python -m pytest --cov=app

      - name: Verify migrations render
        env:
          DEBUG: "true"
          SECRET_KEY: ${{ env.TEST_SECRET_KEY }}
          ENCRYPTION_KEY: ${{ env.TEST_ENCRYPTION_KEY }}
          DATABASE_SYNC_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci
        run: python -m alembic upgrade head --sql > /dev/null

  backend-security:
    name: Backend dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit runtime dependencies
        run: pipx run pip-audit --disable-hash-check -r backend/requirements.txt

  frontend-quality:
    name: Frontend lint & format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Check formatting (prettier)
        run: npm run format:check

  frontend-tests:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests (vitest)
        run: npm test

      - name: Build
        run: npm run build
