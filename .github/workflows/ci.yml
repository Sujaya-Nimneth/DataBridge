name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DEBUG: "true"
          SECRET_KEY: ci-secret-key-that-is-long-enough-123456
          ENCRYPTION_KEY: eKNAOtb7BYu1WMlxkh5tdnFLeNbaF5qAVmJi5MvVg2o=
        run: python -m pytest

      - name: Verify migrations render
        working-directory: backend
        env:
          DEBUG: "true"
          SECRET_KEY: ci-secret-key-that-is-long-enough-123456
          ENCRYPTION_KEY: eKNAOtb7BYu1WMlxkh5tdnFLeNbaF5qAVmJi5MvVg2o=
          DATABASE_SYNC_URL: postgresql+psycopg2://ci:ci@localhost:5432/ci
        run: python -m alembic upgrade head --sql > /dev/null

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
